name: GitHub Pages

on:
  schedule:
    # Run every six hours (UTC), away from the top of the hour.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install uv
        if: github.ref == 'refs/heads/main'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Refresh the SPAR jobs snapshot
        if: github.ref == 'refs/heads/main'
        run: uv run --locked --no-dev update-spar-jobs update

      - name: Stage the static site
        run: |
          mkdir -p site
          cp LICENSE frontend/index.html frontend/favicon.svg frontend/styles.css frontend/*.js frontend/spar_jobs_final.json site/
          cp -R frontend/fonts frontend/vendor site/

      - name: Upload for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
