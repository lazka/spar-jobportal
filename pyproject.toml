[project]
name = "spar-jobportal"
version = "0.1.0"
description = "Data updater for the unofficial SPAR job portal"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
update-spar-jobs = "spar_jobportal.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.15,<0.16", "ty>=0.0.25,<0.1"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["spar_jobportal", "tests", "update_spar_jobs.py"]
